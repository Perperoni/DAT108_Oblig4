<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<link th:href="@{/css/simple.css}" rel="stylesheet" type="text/css" />
	<title>Påmelding</title>
</head>

<body>
<h2>Påmelding</h2>

<p th:if="${redirectMelding}" style="color: red;" th:text="${redirectMelding}"></p>

<fieldset>
	<form th:action="@{/paamelding}" method="post">
		<label for="fornavn">Fornavn: </label>
		<input type="text" id="fornavn" name="fornavn" th:value="${skjema?.fornavn}"><br>

		<label for="etternavn">Etternavn: </label>
		<input type="text" id="etternavn" name="etternavn" th:value="${skjema?.etternavn}"><br>

		<label for="mobil">Mobil: </label>
		<input type="text" id="mobil" name="mobil" th:value="${skjema?.mobil}"><br>

		<label for="passord">Passord: </label>
		<input type="password" id="passord" name="passord"><br>

		<label for="passordRepetert">Gjenta passord: </label>
		<input type="password" id="passordRepetert" name="passordRepetert"><br>

		Kjønn:<br>
		<label><input type="radio" name="kjonn" value="mann"
					  th:checked="${skjema?.kjonn != 'kvinne'}"> Mann</label>
		<label><input type="radio" name="kjonn" value="kvinne"
					  th:checked="${skjema?.kjonn == 'kvinne'}"> Kvinne</label><br>

		<input type="submit" value="Meld meg på!"/>
	</form>
</fieldset>

<script>
	const pw = document.getElementById('passord');
	const gjpw = document.getElementById('passordRepetert');
	function skjekkLike(){
		gjpw.setCustomValidity(pw.value === gjpw.value ? "" : "Må vere like");
	}
	pw.addEventListener('input', skjekkLike);
	gjpw.addEventListener('input', skjekkLike);
</script>

</body>
</html>
