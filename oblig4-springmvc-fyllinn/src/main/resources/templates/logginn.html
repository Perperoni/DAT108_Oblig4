<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/simple.css">
<title>Logg inn</title>
</head>
<body>
	<h2>Logg inn</h2>


	<p th:if="${redirectMelding}" style="color: red;" th:text="${redirectMelding}"></p>
	
	<fieldset>
	<form th:action="@{/innlogging}" method="post">

		<label for="mobil">Mobil:</label>
		<input type="text" id="mobil" name="mobil" required><br>
		<label for="passord">Passord:</label>
		<input type="password" id="passord" name="passord" required><br><br>
		<input type="submit" value="Logg inn">

	</form>
	</fieldset>
</body>
</html>
