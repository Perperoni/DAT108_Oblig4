<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="css/simple.css">
	<title>Deltagerliste</title>
</head>
<body>
	<p>Innlogget som: <span th:text="${session.deltager.mobil}"></span> / <span th:text="${session.deltager.getFulltNavn()}"></span></p>

	<h2>Deltagerliste</h2>
	<table>
		<tr>
			<th>Kjønn</th>
			<th align="left">Navn</th>
			<th align="left">Mobil</th>
		</tr>

		<tr th:each="d : ${deltagere}" th:attr="style=${session.deltager.mobil.equals(d.mobil) ? 'background-color: #8DFFA1': ''}">
			<td th:utext="${d.getKjonnsymbol()}"></td>
			<td th:utext="${d.getFulltNavn()}"></td>
			<td th:utext="${d.getMobilFormatert()}"></td>
		</tr>


	</table>
	<br>

    <!-- TODO - Skjema med knapp for utlogging -->
	<form th:action="@{/utlogging}" method="post">
		<input type="submit" value="Logg ut"/>
	</form>
</body>
</html>
